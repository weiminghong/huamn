  dinov3_model: /home/priv/wmh_project/models/dinov3/vit_base_patch16_dinov3.lvd1689m
  dense_checkpoint: /home/priv/wmh_project/coco_person/outputs/hsm_stage2_dense_student/checkpoint-last
