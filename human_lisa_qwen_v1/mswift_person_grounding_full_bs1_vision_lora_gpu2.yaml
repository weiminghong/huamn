model: /share2/program/weiminghong/model/Qwen2.5-VL-3B-Instruct
dataset:
  - /share2/program/weiminghong/humanslot_outputs/mswift_person_grounding_v1_20260714_retry1/train_full.jsonl
val_dataset:
  - /share2/program/weiminghong/humanslot_outputs/mswift_person_grounding_v1_20260714_retry1/val_full.jsonl
output_dir: /share2/program/weiminghong/humanslot_outputs/mswift_person_grounding_v1_20260714_retry1/sft_full_bs1_vision_lora

tuner_type: lora
torch_dtype: bfloat16
bf16: true
num_train_epochs: 1
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 0.0001
lora_rank: 8
lora_alpha: 16
target_modules:
  - all-linear
freeze_vit: false
freeze_aligner: false
max_length: 2048
logging_steps: 50
save_steps: 8000
eval_steps: 16000
eval_strategy: steps
save_strategy: steps
save_total_limit: 4
report_to: none
remove_unused_columns: false
dataloader_num_workers: 0
