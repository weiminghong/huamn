model_name_or_path: "/home/priv/project/model/Qwen2.5-VL-3B-Instruct"
train_jsonl: "/home/priv/wmh_project/coco_person/ft_data/train.jsonl"
val_jsonl: "/home/priv/wmh_project/coco_person/ft_data/val.jsonl"
image_root: "/home/priv/wmh_project/coco_person/images"
output_dir: "/home/priv/wmh_project/coco_person/outputs/qwen_vl_stage1_sft"

seed: 42
max_train_samples: null
max_val_samples: null
max_length: 4096

train_batch_size: 1
eval_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-5
weight_decay: 0.01
num_train_epochs: 2
warmup_ratio: 0.03

logging_steps: 10
save_steps: 200
eval_steps: 200
save_total_limit: 2
logging_first_step: true
load_best_model_at_end: true
metric_for_best_model: "eval_loss"
greater_is_better: false

bf16: true
fp16: false
gradient_checkpointing: true
dataloader_num_workers: 4
report_to: "none"
extra_prompt: null

swanlab:
  enable: true
  project: "human-box-pose-attr-sft"
  workspace: "wmh"
  experiment_name: "qwen4b-box-pose-sft-server"
  mode: "cloud"
  preview_samples: 4
  preview_max_new_tokens: 1024
  stage_eval:
    enable: true
    samples: 16
    seed: 42
    iou_thr: 0.5
    pck_thr: 0.2

lora:
  enable: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
