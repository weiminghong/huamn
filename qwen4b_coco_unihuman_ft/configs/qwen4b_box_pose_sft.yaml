model_name_or_path: "Qwen/Qwen2.5-VL-3B-Instruct"
train_jsonl: "D:/data/coco_unihuman_stage1/train.jsonl"
val_jsonl: "D:/data/coco_unihuman_stage1/val.jsonl"
image_root: "D:/data/coco"
output_dir: "D:/data/outputs/qwen4b_coco_unihuman_sft"

seed: 42
max_train_samples: null
max_val_samples: null
max_length: 4096

train_batch_size: 1
eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
weight_decay: 0.01
num_train_epochs: 1
warmup_ratio: 0.03

logging_steps: 10
save_steps: 500
eval_steps: 500
save_total_limit: 2

bf16: true
fp16: false
gradient_checkpointing: true
dataloader_num_workers: 2
report_to: "none"
extra_prompt: null

swanlab:
  enable: false
  project: "human-box-pose-attr-sft"
  experiment_name: "qwen4b-coco-unihuman-sft"
  preview_samples: 4
  preview_max_new_tokens: 1024

lora:
  enable: false
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
