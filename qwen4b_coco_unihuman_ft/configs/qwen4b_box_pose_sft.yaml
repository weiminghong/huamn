model_name_or_path: "Qwen/Qwen2.5-VL-3B-Instruct"
train_jsonl: "D:/data/coco_unihuman_stage1/train.jsonl"
val_jsonl: "D:/data/coco_unihuman_stage1/val.jsonl"
image_root: "D:/data/coco"
output_dir: "D:/data/outputs/qwen4b_coco_unihuman_sft"

seed: 42
max_train_samples: null
max_val_samples: null
max_length: 4096

train_batch_size: 1
eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
weight_decay: 0.01
num_train_epochs: 1
warmup_ratio: 0.03

logging_steps: 10
save_steps: 500
eval_steps: 500
save_total_limit: 2
logging_first_step: true
load_best_model_at_end: true
metric_for_best_model: "eval_loss"
greater_is_better: false

bf16: true
fp16: false
gradient_checkpointing: true
dataloader_num_workers: 2
report_to: "none"
extra_prompt: null

swanlab:
  enable: false
  project: "human-box-pose-attr-sft"
  workspace: "wmh"
  experiment_name: "qwen4b-coco-unihuman-sft"
  mode: "cloud"
  preview_samples: 4
  preview_max_new_tokens: 1024
  stage_eval:
    enable: true
    samples: 16
    seed: 42
    iou_thr: 0.5
    pck_thr: 0.2

lora:
  enable: false
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
