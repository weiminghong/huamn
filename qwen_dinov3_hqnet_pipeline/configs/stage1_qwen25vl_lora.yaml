model_name_or_path: "/path/to/Qwen2.5-VL-3B-Instruct"
train_jsonl: "/path/to/ft_box_pose_attr_data/train.jsonl"
val_jsonl: "/path/to/ft_box_pose_attr_data/val.jsonl"
image_root: "/path/to/images"
output_dir: "/path/to/outputs/stage1_qwen25vl_lora"

seed: 42
max_train_samples: null
max_val_samples: null
max_length: 4096

train_batch_size: 1
eval_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-5
weight_decay: 0.01
num_train_epochs: 2
warmup_ratio: 0.03

logging_steps: 10
save_steps: 200
eval_steps: 200
save_total_limit: 2

bf16: true
fp16: false
gradient_checkpointing: true
dataloader_num_workers: 4
report_to: "none"
extra_prompt: null

swanlab:
  enable: false
  project: "qwen-dinov3-hqnet-stage1"
  experiment_name: "stage1-qwen25vl-lora"
  preview_samples: 4
  preview_max_new_tokens: 1024

lora:
  enable: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
